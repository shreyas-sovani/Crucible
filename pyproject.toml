[project]
name = "crucible"
version = "0.1.0"
description = "Closed-loop adversarial payment-fraud lab"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.117,<1",
    "lightgbm>=4.6,<5",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.0,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.hatch.build.targets.wheel.force-include]
"data/ontology.yaml" = "crucible/data/ontology.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
